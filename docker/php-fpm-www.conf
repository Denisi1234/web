; FastNetStays — PHP-FPM pool tuned for fast retrieval under load.
; Default image ships pm.max_children=5 (queues after ~5 concurrent PHP hits).
; This allows ~50 concurrent PHP workers with fast recycle.
[www]
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000
; Fail fast — never block nginx for 2min on a hung backend.
request_terminate_timeout = 30s
; Fast logs, no slow-query noise in prod.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
; Reuse connections, low overhead.
pm.status_path = /fpm-status
ping.path = /fpm-ping
