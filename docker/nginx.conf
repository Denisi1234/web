server {
    listen ${PORT};
    server_name _;
    root /var/www/html/webroot;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Speed: gzip + keepalive ──
    # Cuts HTML/JSON/CSS/JS transfer 60-80% — single biggest "retrieve" win.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/ttf font/opentype image/svg+xml;
    keepalive_timeout 65;
    keepalive_requests 1000;

    index index.php;
    charset utf-8;

    # Host-portal photo uploads (up to 10 MB per file + multipart overhead).
    # nginx default is 1 MB → phone photos died with a 413 HTML page that the
    # upload JS cannot parse ("Upload failed"). Must stay >= PHP limits
    # (docker/php.ini: upload_max_filesize/post_max_size 32M).
    client_max_body_size 32M;

    # Long-lived cache for versioned fingerprinted assets
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
