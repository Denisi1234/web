[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "php82Extensions.pdo_pgsql",
    "php82Extensions.intl",
    "php82Extensions.mbstring",
    "php82Extensions.openssl",
    "php82Extensions.simplexml",
    "php82Extensions.zip",
    "php82Extensions.opcache"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs"
]

[phases.build]
cmds = [
    "mkdir -p tmp/cache/models tmp/cache/persistent tmp/cache/views tmp/sessions logs",
    "chmod -R 777 tmp logs"
]

[variables]
PHP_CLI_SERVER_WORKERS = "8"

[start]
cmd = "php -S 0.0.0.0:${PORT:-8080} -t webroot webroot/index.php"
